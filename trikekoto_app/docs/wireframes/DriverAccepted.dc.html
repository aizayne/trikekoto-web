<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap">
  <style>
    *{box-sizing:border-box}
    body{margin:0;width:390px;height:844px;background:#FAF8F5;color:#1C1917;
      font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
    .disp{font-family:Poppins,system-ui,sans-serif;font-weight:600;letter-spacing:-.01em;margin:0}
    .bar{height:56px;background:#fff;display:flex;align-items:center;
      padding:0 4px 0 16px;border-bottom:1px solid #E7E5E4}
    .bar h1{margin:0;font-size:20px;font-weight:600;font-family:Poppins,system-ui,sans-serif;flex:1}
    .icbtn{width:48px;height:48px;display:flex;align-items:center;justify-content:center}
    .body{padding:16px;display:flex;flex-direction:column;gap:12px}
    .card{background:#fff;border:1px solid #E7E5E4;border-radius:12px}
    .btn{height:48px;border-radius:12px;background:#F5A623;color:#101A2C;
      font-family:Poppins,system-ui,sans-serif;font-weight:600;font-size:15px;
      display:flex;align-items:center;justify-content:center;border:0}
    a{color:#B45309}a:hover{color:#7C3D06}
  </style>
</helmet>
<div class="bar">
  <h1>Current ride</h1>
  <div class="icbtn">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 3v9M6.5 6.5a8 8 0 1 0 11 0" stroke="#1C1917" stroke-width="1.7" stroke-linecap="round"></path>
    </svg>
  </div>
</div>

<div class="body">
  <div style="background:#DCFCE7;border-radius:12px;padding:12px 16px">
    <div class="disp" style="font-size:15px;color:#14532D">Papunta sa pickup</div>
  </div>

  <!-- Destination follows the ride state: pickup while heading out,
       drop-off once the passenger is aboard. -->
  <div class="card" style="height:250px;overflow:hidden;position:relative;background:#E8E4DC">
    <svg width="358" height="250" viewBox="0 0 358 250" aria-hidden="true">
      <rect width="358" height="250" fill="#E9E5DD"></rect>
      <path d="M0 84h358M0 180h358M104 0v250M252 0v250" stroke="#DAD4C8" stroke-width="10"></path>
      <path d="M0 132h358" stroke="#F0EAE0" stroke-width="16"></path>
      <path d="M104 180 L104 132 L252 132 L252 84" stroke="#B45309" stroke-width="4"
        fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
      <circle cx="104" cy="180" r="11" fill="#F5A623" stroke="#101A2C" stroke-width="3"></circle>
      <circle cx="252" cy="84" r="9" fill="#15803D" stroke="#fff" stroke-width="3"></circle>
    </svg>
    <div style="position:absolute;left:12px;bottom:10px;background:rgba(255,255,255,.9);
      border-radius:8px;padding:4px 8px;font-size:11px;color:#57534E">
      © OpenStreetMap contributors
    </div>
  </div>

  <div class="card" style="padding:16px">
    <div style="display:flex;align-items:center;gap:12px">
      <div style="width:44px;height:44px;border-radius:50%;background:#E7E5E4;flex:none;
        display:flex;align-items:center;justify-content:center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM4.5 20a7.5 7.5 0 0 1 15 0"
            stroke="#78716C" stroke-width="1.5" stroke-linecap="round"></path>
        </svg>
      </div>
      <div style="flex:1">
        <div class="disp" style="font-size:17px">Maria Santos</div>
        <div style="font-size:13px;color:#57534E">Sari-sari Store, Purok 3</div>
      </div>
      <div style="width:48px;height:48px;border-radius:12px;border:1px solid #D6D3D1;
        display:flex;align-items:center;justify-content:center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M6.5 3.5 9 8l-2 2a12 12 0 0 0 7 7l2-2 4.5 2.5-1 3A17.5 17.5 0 0 1 3.5 4.5l3-1Z"
            stroke="#B45309" stroke-width="1.6" stroke-linejoin="round"></path>
        </svg>
      </div>
    </div>
  </div>

  <div style="height:48px;border-radius:12px;border:1px solid #D6D3D1;background:#fff;
    display:flex;align-items:center;justify-content:center;gap:8px;
    font-family:Poppins,system-ui,sans-serif;font-weight:600;font-size:15px;color:#B45309">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 21s6.5-6.1 6.5-10.5a6.5 6.5 0 1 0-13 0C5.5 14.9 12 21 12 21Z"
        stroke="#B45309" stroke-width="1.6" stroke-linejoin="round"></path>
    </svg>
    Buksan sa navigation app
  </div>

  <div class="btn">Start trip</div>

  <div style="height:48px;display:flex;align-items:center;justify-content:center;
    color:#B91C1C;font-family:Poppins,system-ui,sans-serif;font-weight:600;font-size:15px">
    Cancel ride
  </div>
</div>
</x-dc>
</body>
</html>
