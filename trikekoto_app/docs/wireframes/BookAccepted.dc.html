<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap">
  <style>
    *{box-sizing:border-box}
    body{margin:0;width:390px;height:844px;background:#FAF8F5;color:#1C1917;
      font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
    .disp{font-family:Poppins,system-ui,sans-serif;font-weight:600;letter-spacing:-.01em;margin:0}
    .bar{height:56px;background:#fff;display:flex;align-items:center;
      padding:0 4px 0 16px;border-bottom:1px solid #E7E5E4}
    .bar h1{margin:0;font-size:20px;font-weight:600;font-family:Poppins,system-ui,sans-serif;flex:1}
    .icbtn{width:48px;height:48px;display:flex;align-items:center;justify-content:center}
    .body{padding:16px;display:flex;flex-direction:column;gap:12px}
    .card{background:#fff;border:1px solid #E7E5E4;border-radius:12px}
    .btn{height:48px;border-radius:12px;border:1px solid #B91C1C;color:#B91C1C;background:transparent;
      font-family:Poppins,system-ui,sans-serif;font-weight:600;font-size:15px;
      display:flex;align-items:center;justify-content:center}
    a{color:#B45309}a:hover{color:#7C3D06}
  </style>
</helmet>
<div class="bar">
  <h1>Saan tayo?</h1>
  <div class="icbtn">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 3v9M6.5 6.5a8 8 0 1 0 11 0" stroke="#1C1917" stroke-width="1.7" stroke-linecap="round"></path>
    </svg>
  </div>
</div>

<div class="body">
  <div style="background:#DCFCE7;border-radius:12px;padding:14px 16px;display:flex;
    align-items:center;gap:12px">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" style="flex:none" aria-hidden="true">
      <path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18ZM8.5 12.2l2.4 2.4 4.6-5"
        stroke="#14532D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
    <div>
      <div class="disp" style="font-size:17px;color:#14532D">Driver is on the way</div>
      <div style="font-size:13px;color:#14532D">Papalapit na — mga 4 minuto</div>
    </div>
  </div>

  <!-- OSM tile map, live trike marker + the commuter's own dot.
       The commuter's position is read and drawn on the device and is
       NEVER written to Firestore. -->
  <div class="card" style="height:240px;overflow:hidden;position:relative;background:#E8E4DC">
    <svg width="358" height="240" viewBox="0 0 358 240" aria-hidden="true">
      <rect width="358" height="240" fill="#E9E5DD"></rect>
      <path d="M0 80h358M0 168h358M96 0v240M244 0v240" stroke="#DAD4C8" stroke-width="10"></path>
      <path d="M0 128h358" stroke="#F0EAE0" stroke-width="16"></path>
      <path d="M96 168 L96 128 L244 128 L244 80" stroke="#B45309" stroke-width="4"
        fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
      <circle cx="96" cy="168" r="9" fill="#1D4ED8" stroke="#fff" stroke-width="3"></circle>
      <circle cx="244" cy="80" r="11" fill="#F5A623" stroke="#101A2C" stroke-width="3"></circle>
    </svg>
    <div style="position:absolute;left:12px;bottom:10px;background:rgba(255,255,255,.9);
      border-radius:8px;padding:4px 8px;font-size:11px;color:#57534E">
      © OpenStreetMap contributors
    </div>
  </div>

  <div class="card" style="padding:16px;display:flex;align-items:center;gap:14px">
    <div style="width:52px;height:52px;border-radius:50%;background:#FDECD2;flex:none;
      display:flex;align-items:center;justify-content:center">
      <span class="disp" style="font-size:20px;color:#7C3D06">JD</span>
    </div>
    <div style="flex:1">
      <div class="disp" style="font-size:17px">Juan Dela Cruz</div>
      <div style="font-size:13px;color:#57534E">ABC 1234 · ★ 4.8 (36)</div>
    </div>
    <div style="width:48px;height:48px;border-radius:12px;background:#F5A623;
      display:flex;align-items:center;justify-content:center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M6.5 3.5 9 8l-2 2a12 12 0 0 0 7 7l2-2 4.5 2.5-1 3A17.5 17.5 0 0 1 3.5 4.5l3-1Z"
          stroke="#101A2C" stroke-width="1.6" stroke-linejoin="round"></path>
      </svg>
    </div>
  </div>

  <div class="btn">Cancel ride</div>
</div>
</x-dc>
</body>
</html>
