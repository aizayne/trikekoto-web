<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap">
  <style>
    *{box-sizing:border-box}
    body{margin:0;width:390px;height:844px;background:#FAF8F5;color:#1C1917;
      font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
    .disp{font-family:Poppins,system-ui,sans-serif;font-weight:600;letter-spacing:-.01em;margin:0}
    .bar{height:56px;background:#fff;display:flex;align-items:center;
      padding:0 4px 0 16px;border-bottom:1px solid #E7E5E4}
    .bar h1{margin:0;font-size:20px;font-weight:600;font-family:Poppins,system-ui,sans-serif;flex:1}
    .icbtn{width:48px;height:48px;display:flex;align-items:center;justify-content:center}
    .body{padding:16px;display:flex;flex-direction:column;gap:12px}
    .card{background:#fff;border:1px solid #E7E5E4;border-radius:12px;padding:16px}
    .seg{flex:1;height:36px;border-radius:8px;display:flex;align-items:center;
      justify-content:center;font-size:14px;color:#57534E}
    .seg.on{background:#101A2C;color:#fff;font-family:Poppins,system-ui,sans-serif;font-weight:600}
    a{color:#B45309}a:hover{color:#7C3D06}
  </style>
</helmet>
<div class="bar">
  <h1>Admin</h1>
  <div class="icbtn">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 3v9M6.5 6.5a8 8 0 1 0 11 0" stroke="#1C1917" stroke-width="1.7" stroke-linecap="round"></path>
    </svg>
  </div>
</div>

<div class="body">
  <div style="display:flex;gap:4px;background:#E7E5E4;border-radius:10px;padding:4px">
    <div class="seg on">Today</div>
    <div class="seg">7 days</div>
    <div class="seg">30 days</div>
  </div>

  <!-- Five headline figures. No money box: the fare engine was removed, and
       the app quotes no prices and stores none. -->
  <div class="card" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px">
    <div>
      <div class="disp" style="font-size:24px">38</div>
      <div style="font-size:12px;color:#57534E">Biyahe</div>
    </div>
    <div>
      <div class="disp" style="font-size:24px;color:#15803D">31</div>
      <div style="font-size:12px;color:#57534E">Natapos</div>
    </div>
    <div>
      <div class="disp" style="font-size:24px;color:#B91C1C">4</div>
      <div style="font-size:12px;color:#57534E">Kansela</div>
    </div>
    <div>
      <div class="disp" style="font-size:24px">82%</div>
      <div style="font-size:12px;color:#57534E">Completion</div>
    </div>
    <div>
      <div class="disp" style="font-size:24px">★ 4.7</div>
      <div style="font-size:12px;color:#57534E">Rating</div>
    </div>
    <div>
      <div class="disp" style="font-size:24px">7</div>
      <div style="font-size:12px;color:#57534E">Di-narate</div>
    </div>
  </div>

  <div class="card">
    <div class="disp" style="font-size:15px;margin-bottom:14px">Araw-araw</div>
    <div style="display:flex;align-items:flex-end;gap:8px;height:110px">
      <div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2px">
        <div style="height:52px;background:#15803D;border-radius:3px 3px 0 0"></div>
        <div style="height:8px;background:#B91C1C"></div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2px">
        <div style="height:74px;background:#15803D;border-radius:3px 3px 0 0"></div>
        <div style="height:6px;background:#B91C1C"></div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2px">
        <div style="height:38px;background:#15803D;border-radius:3px 3px 0 0"></div>
        <div style="height:12px;background:#B91C1C"></div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2px">
        <div style="height:88px;background:#15803D;border-radius:3px 3px 0 0"></div>
        <div style="height:4px;background:#B91C1C"></div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2px">
        <div style="height:64px;background:#15803D;border-radius:3px 3px 0 0"></div>
        <div style="height:10px;background:#B91C1C"></div>
      </div>
      <!-- A day with no rides still draws a gap rather than being skipped,
           which would make a quiet Sunday look like a missing day. -->
      <div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end">
        <div style="height:2px;background:#D6D3D1"></div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2px">
        <div style="height:46px;background:#15803D;border-radius:3px 3px 0 0"></div>
      </div>
    </div>
  </div>

  <div class="card" style="padding:0">
    <div class="disp" style="font-size:15px;padding:16px 16px 10px">Mga driver</div>
    <div style="display:flex;justify-content:space-between;padding:10px 16px;
      border-top:1px solid #E7E5E4;font-size:15px">
      <span>Juan Dela Cruz</span><span style="color:#57534E">12 · ★ 4.8</span>
    </div>
    <div style="display:flex;justify-content:space-between;padding:10px 16px;
      border-top:1px solid #E7E5E4;font-size:15px">
      <span>Pedro Ramos</span><span style="color:#57534E">9 · ★ 4.6</span>
    </div>
    <div style="display:flex;justify-content:space-between;padding:10px 16px;
      border-top:1px solid #E7E5E4;font-size:15px">
      <span>Mario Cruz</span><span style="color:#57534E">6 · ★ 4.9</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
