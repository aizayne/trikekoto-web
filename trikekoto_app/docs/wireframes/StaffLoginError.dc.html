<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap">
  <style>
    *{box-sizing:border-box}
    body{margin:0;width:390px;height:844px;background:#FAF8F5;color:#1C1917;
      font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
    .disp{font-family:Poppins,system-ui,sans-serif;font-weight:600;letter-spacing:-.01em;margin:0}
    .bar{height:56px;background:#fff;display:flex;align-items:center;gap:4px;
      padding:0 4px;border-bottom:1px solid #E7E5E4}
    .bar h1{margin:0;font-size:20px;font-weight:600;font-family:Poppins,system-ui,sans-serif}
    .icbtn{width:48px;height:48px;display:flex;align-items:center;justify-content:center}
    .body{padding:24px;display:flex;flex-direction:column;gap:16px}
    .field{height:56px;border:1px solid #A8A29E;border-radius:12px;padding:6px 14px;
      display:flex;align-items:center;gap:12px;background:#fff}
    .field.bad{border:2px solid #B91C1C}
    .err{color:#B91C1C;font-size:13px;margin:-10px 0 0;padding-left:14px}
    .btn{height:48px;border-radius:12px;background:#F5A623;color:#101A2C;
      font-family:Poppins,system-ui,sans-serif;font-weight:600;font-size:15px;
      display:flex;align-items:center;justify-content:center;border:0}
    .btn.ghost{background:transparent;color:#B45309;border:1px solid #D6D3D1}
    a{color:#B45309}a:hover{color:#7C3D06}
  </style>
</helmet>
<div class="bar">
  <div class="icbtn">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M19 12H5M11 6l-6 6 6 6" stroke="#1C1917" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
  </div>
  <h1>Sign in</h1>
</div>

<div class="body">
  <h2 class="disp" style="font-size:28px;font-weight:700;margin-top:16px">Welcome back</h2>
  <p style="margin:0 0 8px;font-size:15px;color:#57534E">
    Para sa mga TODA driver at opisyal ng chapter.
  </p>

  <!-- Per-field messages sit under the offending field, not in a snackbar:
       a general "invalid input" makes the user hunt for which one. -->
  <div class="field bad">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M3.5 6.5h17v11h-17v-11ZM3.5 7l8.5 6 8.5-6" stroke="#B91C1C"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
    <span style="font-size:16px">juan.delacruz</span>
  </div>
  <p class="err">Kulang ang email — dapat may @ at domain</p>

  <div class="field bad">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M6.5 10.5V8a5.5 5.5 0 0 1 11 0v2.5M5 10.5h14v9H5v-9Z" stroke="#B91C1C"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
    <span style="font-size:16px;color:#A8A29E">Password</span>
  </div>
  <p class="err">Ilagay ang password mo</p>

  <div class="btn" style="margin-top:8px">Sign in</div>
  <div class="btn ghost">Register as a TODA driver</div>
</div>
</x-dc>
</body>
</html>
