<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap">
  <style>
    *{box-sizing:border-box}
    body{margin:0;width:390px;height:844px;background:#FAF8F5;color:#1C1917;
      font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
    .disp{font-family:Poppins,system-ui,sans-serif;font-weight:600;letter-spacing:-.01em;margin:0}
    .bar{height:56px;background:#fff;display:flex;align-items:center;
      padding:0 4px 0 16px;border-bottom:1px solid #E7E5E4}
    .bar h1{margin:0;font-size:20px;font-weight:600;font-family:Poppins,system-ui,sans-serif;flex:1}
    .icbtn{width:48px;height:48px;display:flex;align-items:center;justify-content:center}
    .body{padding:24px;display:flex;flex-direction:column;align-items:stretch}
    .field{height:56px;border:1px solid #A8A29E;border-radius:12px;padding:6px 14px;
      display:flex;align-items:center;gap:12px;background:#fff}
    .btn{height:48px;border-radius:12px;background:#F5A623;color:#101A2C;
      font-family:Poppins,system-ui,sans-serif;font-weight:600;font-size:15px;
      display:flex;align-items:center;justify-content:center;border:0}
    a{color:#B45309}a:hover{color:#7C3D06}
  </style>
</helmet>
<div class="bar">
  <h1>Almost done</h1>
  <div class="icbtn">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 3v9M6.5 6.5a8 8 0 1 0 11 0" stroke="#1C1917" stroke-width="1.7"
        stroke-linecap="round"></path>
    </svg>
  </div>
  <div class="icbtn">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M15 12H4M8 8l-4 4 4 4M10 4.5h8a1.5 1.5 0 0 1 1.5 1.5v12a1.5 1.5 0 0 1-1.5 1.5h-8"
        stroke="#1C1917" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
  </div>
</div>

<div class="body">
  <!-- Avatar picker: 96px circle, secondaryContainer fill, camera badge -->
  <div style="align-self:center;position:relative;width:96px;height:96px">
    <div style="width:96px;height:96px;border-radius:50%;background:#FDECD2;
      display:flex;align-items:center;justify-content:center">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM4.5 20a7.5 7.5 0 0 1 15 0"
          stroke="#7C3D06" stroke-width="1.5" stroke-linecap="round"></path>
      </svg>
    </div>
    <div style="position:absolute;right:0;bottom:0;width:28px;height:28px;border-radius:50%;
      background:#101A2C;border:2px solid #FAF8F5;display:flex;align-items:center;justify-content:center">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4 8h3l1.5-2h7L17 8h3v11H4V8ZM12 16.5a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"
          stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    </div>
  </div>
  <p style="margin:8px 0 0;text-align:center;color:#57534E;font-size:13px">
    Litrato — puwedeng laktawan
  </p>

  <h2 class="disp" style="font-size:24px;text-align:center;margin-top:20px">
    Anong itatawag namin sa iyo?
  </h2>
  <p style="margin:8px 0 24px;text-align:center;font-size:15px;color:#57534E">
    Ito ang makikita ng driver kapag sinundo ka.
  </p>

  <div class="field">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M4.5 6.5h15v11h-15v-11ZM9 12a1.75 1.75 0 1 0 0-3.5A1.75 1.75 0 0 0 9 12ZM6.5 15.5a3 3 0 0 1 5 0M14 10.5h3.5M14 13.5h3.5"
        stroke="#57534E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
    <span style="font-size:16px">Maria Santos</span>
  </div>

  <!-- Number is shown, never editable: changing it means proving a new one. -->
  <div style="display:flex;align-items:center;gap:8px;margin-top:16px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="flex:none" aria-hidden="true">
      <path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18ZM8.5 12.2l2.4 2.4 4.6-5"
        stroke="#15803D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
    <span style="color:#57534E;font-size:13px">+639171234567 — nakumpirma na</span>
  </div>

  <div class="btn" style="margin-top:24px">Simulan</div>
</div>
</x-dc>
</body>
</html>
