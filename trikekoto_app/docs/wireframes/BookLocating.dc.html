<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap">
  <style>
    *{box-sizing:border-box}
    body{margin:0;width:390px;height:844px;background:#FAF8F5;color:#1C1917;
      font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
    .disp{font-family:Poppins,system-ui,sans-serif;font-weight:600;letter-spacing:-.01em;margin:0}
    .bar{height:56px;background:#fff;display:flex;align-items:center;
      padding:0 4px 0 16px;border-bottom:1px solid #E7E5E4}
    .bar h1{margin:0;font-size:20px;font-weight:600;font-family:Poppins,system-ui,sans-serif;flex:1}
    .icbtn{width:48px;height:48px;display:flex;align-items:center;justify-content:center}
    .body{padding:24px;display:flex;flex-direction:column;gap:16px}
    .card{background:#fff;border:1px solid #E7E5E4;border-radius:12px;padding:4px}
    .row{min-height:56px;display:flex;align-items:center;gap:12px;padding:8px 12px}
    .rowlab{font-size:12px;color:#57534E}
    .rowval{font-size:16px}
    .ph{font-size:16px;color:#A8A29E}
    .field{height:56px;border:1px solid #A8A29E;border-radius:12px;padding:6px 14px;
      display:flex;align-items:center;gap:12px;background:#fff}
    .btn{height:48px;border-radius:12px;background:#E7E5E4;color:#A8A29E;
      font-family:Poppins,system-ui,sans-serif;font-weight:600;font-size:15px;
      display:flex;align-items:center;justify-content:center;border:0}
    a{color:#B45309}a:hover{color:#7C3D06}
  </style>
</helmet>
<div class="bar">
  <h1>Saan tayo?</h1>
  <div class="icbtn">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 3v9M6.5 6.5a8 8 0 1 0 11 0" stroke="#1C1917" stroke-width="1.7" stroke-linecap="round"></path>
    </svg>
  </div>
  <div class="icbtn">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M15 12H4M8 8l-4 4 4 4M10 4.5h8a1.5 1.5 0 0 1 1.5 1.5v12a1.5 1.5 0 0 1-1.5 1.5h-8"
        stroke="#1C1917" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
  </div>
</div>

<div class="body">
  <div class="card">
    <div class="row">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" style="flex:none" aria-hidden="true">
        <path d="M12 8.5v-4M12 19.5v-4M8.5 12h-4M19.5 12h-4M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"
          stroke="#15803D" stroke-width="1.6" stroke-linecap="round"></path>
      </svg>
      <div style="flex:1">
        <div class="rowlab">Pickup</div>
        <!-- The locating state: says what is happening, so nobody taps away
             from a field that is about to fill itself in. -->
        <div class="ph">Hinahanap ang lokasyon mo…</div>
      </div>
      <div style="width:16px;height:16px;border:2px solid #D6D3D1;border-top-color:#B45309;
        border-radius:50%"></div>
    </div>

    <div style="padding-left:34px">
      <div style="width:1px;height:18px;background:#D6D3D1"></div>
    </div>

    <div class="row">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" style="flex:none" aria-hidden="true">
        <path d="M12 21s6.5-6.1 6.5-10.5a6.5 6.5 0 1 0-13 0C5.5 14.9 12 21 12 21ZM12 13a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z"
          stroke="#B91C1C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      <div style="flex:1">
        <div class="rowlab">Drop-off</div>
        <div class="ph">Set on map</div>
      </div>
    </div>
  </div>

  <div class="field"><span class="ph">Pangalan</span></div>
  <div class="field"><span class="ph">Mobile number</span></div>

  <div class="btn">Find a driver</div>
</div>
</x-dc>
</body>
</html>
