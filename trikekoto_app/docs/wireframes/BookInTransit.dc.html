<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap">
  <style>
    *{box-sizing:border-box}
    body{margin:0;width:390px;height:844px;background:#FAF8F5;color:#1C1917;
      font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
    .disp{font-family:Poppins,system-ui,sans-serif;font-weight:600;letter-spacing:-.01em;margin:0}
    .bar{height:56px;background:#fff;display:flex;align-items:center;
      padding:0 4px 0 16px;border-bottom:1px solid #E7E5E4}
    .bar h1{margin:0;font-size:20px;font-weight:600;font-family:Poppins,system-ui,sans-serif;flex:1}
    .icbtn{width:48px;height:48px;display:flex;align-items:center;justify-content:center}
    .body{padding:16px;display:flex;flex-direction:column;gap:12px}
    .card{background:#fff;border:1px solid #E7E5E4;border-radius:12px}
    a{color:#B45309}a:hover{color:#7C3D06}
  </style>
</helmet>
<div class="bar">
  <h1>Saan tayo?</h1>
  <div class="icbtn">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 3v9M6.5 6.5a8 8 0 1 0 11 0" stroke="#1C1917" stroke-width="1.7" stroke-linecap="round"></path>
    </svg>
  </div>
</div>

<div class="body">
  <div style="background:#DBEAFE;border-radius:12px;padding:14px 16px;display:flex;
    align-items:center;gap:12px">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" style="flex:none" aria-hidden="true">
      <path d="M4 16h2M9 16h6M6 16a1.5 1.5 0 1 0 3 0 1.5 1.5 0 1 0-3 0M15 16a1.5 1.5 0 1 0 3 0 1.5 1.5 0 1 0-3 0M8 14.5V9h4l3 5.5M5 9h3"
        stroke="#1D4ED8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
    <div>
      <div class="disp" style="font-size:17px;color:#1D4ED8">On the way to your drop-off</div>
      <div style="font-size:13px;color:#1D4ED8">Palengke, San Marcelino</div>
    </div>
  </div>

  <div class="card" style="height:300px;overflow:hidden;position:relative;background:#E8E4DC">
    <svg width="358" height="300" viewBox="0 0 358 300" aria-hidden="true">
      <rect width="358" height="300" fill="#E9E5DD"></rect>
      <path d="M0 96h358M0 210h358M110 0v300M258 0v300" stroke="#DAD4C8" stroke-width="10"></path>
      <path d="M0 152h358" stroke="#F0EAE0" stroke-width="16"></path>
      <path d="M110 210 L110 152 L258 152 L258 96" stroke="#B45309" stroke-width="4"
        fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
      <circle cx="180" cy="152" r="11" fill="#F5A623" stroke="#101A2C" stroke-width="3"></circle>
      <circle cx="258" cy="96" r="9" fill="#B91C1C" stroke="#fff" stroke-width="3"></circle>
    </svg>
    <div style="position:absolute;left:12px;bottom:10px;background:rgba(255,255,255,.9);
      border-radius:8px;padding:4px 8px;font-size:11px;color:#57534E">
      © OpenStreetMap contributors
    </div>
  </div>

  <div class="card" style="padding:16px;display:flex;align-items:center;gap:14px">
    <div style="width:52px;height:52px;border-radius:50%;background:#FDECD2;flex:none;
      display:flex;align-items:center;justify-content:center">
      <span class="disp" style="font-size:20px;color:#7C3D06">JD</span>
    </div>
    <div style="flex:1">
      <div class="disp" style="font-size:17px">Juan Dela Cruz</div>
      <div style="font-size:13px;color:#57534E">ABC 1234 · ★ 4.8 (36)</div>
    </div>
  </div>

  <!-- No cancel button. The passenger is physically in the vehicle; the rules
       refuse a commuter cancel from in_transit, so offering one would be a
       button that fails. -->
  <div style="text-align:center;color:#57534E;font-size:13px;padding:8px 24px">
    Nasa biyahe ka na. Kung may problema, i-report pagkatapos ng biyahe.
  </div>
</div>
</x-dc>
</body>
</html>
