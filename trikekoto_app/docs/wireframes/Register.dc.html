<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap">
  <style>
    *{box-sizing:border-box}
    body{margin:0;width:390px;height:844px;background:#FAF8F5;color:#1C1917;
      font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
    .disp{font-family:Poppins,system-ui,sans-serif;font-weight:600;letter-spacing:-.01em;margin:0}
    .bar{height:56px;background:#fff;display:flex;align-items:center;gap:4px;
      padding:0 4px;border-bottom:1px solid #E7E5E4}
    .bar h1{margin:0;font-size:20px;font-weight:600;font-family:Poppins,system-ui,sans-serif}
    .icbtn{width:48px;height:48px;display:flex;align-items:center;justify-content:center}
    .body{padding:20px 24px;display:flex;flex-direction:column;gap:12px}
    .field{height:52px;border:1px solid #A8A29E;border-radius:12px;padding:6px 14px;
      display:flex;align-items:center;gap:12px;background:#fff}
    .btn{height:48px;border-radius:12px;background:#F5A623;color:#101A2C;
      font-family:Poppins,system-ui,sans-serif;font-weight:600;font-size:15px;
      display:flex;align-items:center;justify-content:center;border:0}
    a{color:#B45309}a:hover{color:#7C3D06}
  </style>
</helmet>
<div class="bar">
  <div class="icbtn">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M19 12H5M11 6l-6 6 6 6" stroke="#1C1917" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
  </div>
  <h1>Register</h1>
</div>

<div class="body">
  <p style="margin:4px 0 8px;font-size:15px;color:#57534E">
    Iri-review ng opisyal ng chapter ang rehistro mo bago ka makatanggap ng biyahe.
  </p>

  <div class="field"><span style="font-size:16px;color:#A8A29E">Pangalan</span></div>
  <div class="field"><span style="font-size:16px;color:#A8A29E">Apelyido</span></div>
  <div class="field"><span style="font-size:16px;color:#A8A29E">Mobile number</span></div>
  <div class="field"><span style="font-size:16px;color:#A8A29E">Plate number</span></div>
  <div class="field"><span style="font-size:16px;color:#A8A29E">TODA chapter</span></div>
  <div class="field"><span style="font-size:16px;color:#A8A29E">Body number (opsyonal)</span></div>
  <div class="field"><span style="font-size:16px;color:#A8A29E">Email</span></div>
  <div class="field"><span style="font-size:16px;color:#A8A29E">Password</span></div>

  <div class="btn" style="margin-top:8px">Create account</div>

  <!-- status is forced to `pending` by the security rules: a driver cannot
       register themselves as approved. -->
  <p style="margin:4px 0 0;text-align:center;color:#57534E;font-size:13px">
    Magsisimula ka bilang <strong>pending</strong> hanggang maaprubahan.
  </p>
</div>
</x-dc>
</body>
</html>
