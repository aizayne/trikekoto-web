<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap">
  <style>
    *{box-sizing:border-box}
    body{margin:0;width:390px;height:844px;background:#FAF8F5;color:#1C1917;
      font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
    .disp{font-family:Poppins,system-ui,sans-serif;font-weight:600;letter-spacing:-.01em;margin:0}
    .wrap{height:100%;display:flex;flex-direction:column;justify-content:center;
      align-items:center;padding:32px;gap:16px;text-align:center}
    .btn{width:100%;height:48px;border-radius:12px;background:#F5A623;color:#101A2C;
      font-family:Poppins,system-ui,sans-serif;font-weight:600;font-size:15px;
      display:flex;align-items:center;justify-content:center;gap:8px;border:0}
    .btn.ghost{background:transparent;color:#B45309;border:1px solid #D6D3D1}
    .muted{color:#57534E;font-size:13px;line-height:1.45}
    a{color:#B45309}a:hover{color:#7C3D06}
  </style>
</helmet>
<div class="wrap">
  <svg width="72" height="72" viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <rect width="24" height="24" rx="6" fill="#101A2C"></rect>
    <path d="M5.5 15.5h2.2M11 15.5h5.2M7 15.5a1.6 1.6 0 1 0 3.2 0 1.6 1.6 0 1 0-3.2 0M15.4 15.5a1.6 1.6 0 1 0 3.2 0 1.6 1.6 0 1 0-3.2 0M8.6 13.9V9.2h4.1l2.9 4.7M6.4 9.2h3.4"
      stroke="#F5A623" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path>
  </svg>

  <h1 class="disp" style="font-size:38px;font-weight:700;margin-top:8px">TrikeKoTo</h1>
  <p style="margin:0;font-size:16px;color:#57534E;max-width:280px">
    Sakay agad. Hanapin ang pinakamalapit na tricycle sa TODA ninyo.
  </p>

  <div style="display:flex;flex-direction:column;gap:12px;width:100%;margin-top:24px">
    <div class="btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4 16h2M9 16h6M6 16a1.5 1.5 0 1 0 3 0 1.5 1.5 0 1 0-3 0M15 16a1.5 1.5 0 1 0 3 0 1.5 1.5 0 1 0-3 0M8 14.5V9h4l3 5.5M5 9h3"
          stroke="#101A2C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      Book a ride
    </div>
    <div class="btn ghost">Driver / Admin sign in</div>
  </div>

  <p class="muted" style="margin-top:auto;max-width:300px">
    Para sa mga rehistradong TODA driver at opisyal ng chapter.
  </p>
</div>
</x-dc>
</body>
</html>
