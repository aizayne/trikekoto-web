<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap">
  <style>
    *{box-sizing:border-box}
    body{margin:0;width:390px;height:844px;background:#FAF8F5;color:#1C1917;
      font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
    .disp{font-family:Poppins,system-ui,sans-serif;font-weight:600;letter-spacing:-.01em;margin:0}
    .bar{height:56px;background:#fff;display:flex;align-items:center;
      padding:0 4px 0 16px;border-bottom:1px solid #E7E5E4}
    .bar h1{margin:0;font-size:20px;font-weight:600;font-family:Poppins,system-ui,sans-serif;flex:1}
    .icbtn{width:48px;height:48px;display:flex;align-items:center;justify-content:center}
    .btn{height:48px;border-radius:12px;background:#F5A623;color:#101A2C;padding:0 24px;
      font-family:Poppins,system-ui,sans-serif;font-weight:600;font-size:15px;
      display:flex;align-items:center;justify-content:center;border:0}
    a{color:#B45309}a:hover{color:#7C3D06}
  </style>
</helmet>
<div class="bar">
  <h1>Saan tayo?</h1>
  <div class="icbtn">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 3v9M6.5 6.5a8 8 0 1 0 11 0" stroke="#1C1917" stroke-width="1.7" stroke-linecap="round"></path>
    </svg>
  </div>
</div>

<!-- AppEmptyState: icon, plain sentence, one action. Never a raw exception —
     describeError() turns permission-denied into language a commuter can act on. -->
<div style="height:calc(844px - 56px);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;padding:32px;text-align:center">
  <svg width="56" height="56" viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <path d="M6.5 18.5a4 4 0 0 1-.4-8 6 6 0 0 1 11.2-1.6M3 3l18 18M14 12.5a4 4 0 0 1 3.6 6"
      stroke="#78716C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
  </svg>
  <h2 class="disp" style="font-size:20px">Nawalan ng koneksyon</h2>
  <p style="margin:0;color:#57534E;font-size:15px;max-width:280px">
    Hindi namin makita ang biyahe mo ngayon. Tingnan ang signal, tapos subukang muli.
  </p>
  <div class="btn" style="margin-top:8px">Try again</div>
</div>
</x-dc>
</body>
</html>
