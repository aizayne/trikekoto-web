<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap">
  <style>
    *{box-sizing:border-box}
    body{margin:0;width:390px;height:844px;background:#FAF8F5;color:#1C1917;
      font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
    .disp{font-family:Poppins,system-ui,sans-serif;font-weight:600;letter-spacing:-.01em;margin:0}
    .bar{height:56px;background:#fff;display:flex;align-items:center;
      padding:0 4px 0 16px;border-bottom:1px solid #E7E5E4}
    .bar h1{margin:0;font-size:20px;font-weight:600;font-family:Poppins,system-ui,sans-serif;flex:1}
    .icbtn{width:48px;height:48px;display:flex;align-items:center;justify-content:center}
    .body{padding:24px;display:flex;flex-direction:column;gap:16px}
    .card{background:#fff;border:1px solid #E7E5E4;border-radius:12px;padding:16px}
    .btn{height:48px;border-radius:12px;background:#F5A623;color:#101A2C;flex:1;
      font-family:Poppins,system-ui,sans-serif;font-weight:600;font-size:15px;
      display:flex;align-items:center;justify-content:center;border:0}
    .btn.ghost{background:transparent;color:#57534E;border:1px solid #D6D3D1}
    a{color:#B45309}a:hover{color:#7C3D06}
  </style>
</helmet>
<div class="bar">
  <h1>Dashboard</h1>
  <div class="icbtn">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 3v9M6.5 6.5a8 8 0 1 0 11 0" stroke="#1C1917" stroke-width="1.7" stroke-linecap="round"></path>
    </svg>
  </div>
</div>

<div class="body">
  <div class="card" style="display:flex;align-items:center;gap:14px;padding:14px 16px">
    <div style="flex:1">
      <div class="disp" style="font-size:15px;color:#15803D">Naka-online</div>
    </div>
    <div style="width:52px;height:32px;border-radius:16px;background:#15803D;
      display:flex;align-items:center;justify-content:flex-end;padding:3px">
      <div style="width:26px;height:26px;border-radius:50%;background:#fff"></div>
    </div>
  </div>

  <!-- One offer at a time. The greedy sweep pings the nearest untried driver
       alone for 15 s — no broadcast, so there is no race to tap first and the
       nearest driver gets genuine right of first refusal. -->
  <div class="card" style="border:2px solid #F5A623;padding:20px 16px">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div class="disp" style="font-size:20px">New ride offer</div>
      <div style="background:#FDECD2;border-radius:8px;padding:4px 10px;
        font-family:Poppins,system-ui,sans-serif;font-weight:600;font-size:15px;color:#7C3D06">
        12s
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:12px;margin-top:18px">
      <div style="width:44px;height:44px;border-radius:50%;background:#E7E5E4;flex:none;
        display:flex;align-items:center;justify-content:center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM4.5 20a7.5 7.5 0 0 1 15 0"
            stroke="#78716C" stroke-width="1.5" stroke-linecap="round"></path>
        </svg>
      </div>
      <div>
        <div class="disp" style="font-size:17px">Maria Santos</div>
        <div style="font-size:13px;color:#57534E">1.2 km ang layo sa iyo</div>
      </div>
    </div>

    <div style="height:1px;background:#E7E5E4;margin:16px 0"></div>

    <div style="display:flex;gap:12px;align-items:flex-start">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" style="flex:none;margin-top:2px" aria-hidden="true">
        <path d="M12 8.5v-4M12 19.5v-4M8.5 12h-4M19.5 12h-4M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"
          stroke="#15803D" stroke-width="1.6" stroke-linecap="round"></path>
      </svg>
      <div>
        <div style="font-size:12px;color:#57534E">Sunduin sa</div>
        <div style="font-size:16px">Sari-sari Store, Purok 3</div>
      </div>
    </div>

    <div style="display:flex;gap:12px;align-items:flex-start;margin-top:14px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" style="flex:none;margin-top:2px" aria-hidden="true">
        <path d="M12 21s6.5-6.1 6.5-10.5a6.5 6.5 0 1 0-13 0C5.5 14.9 12 21 12 21ZM12 13a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z"
          stroke="#B91C1C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      <div>
        <div style="font-size:12px;color:#57534E">Ihahatid sa</div>
        <div style="font-size:16px">Palengke, San Marcelino</div>
      </div>
    </div>

    <div style="display:flex;gap:12px;margin-top:22px">
      <div class="btn ghost">Decline</div>
      <div class="btn">Accept</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
