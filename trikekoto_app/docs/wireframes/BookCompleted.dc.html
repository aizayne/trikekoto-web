<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap">
  <style>
    *{box-sizing:border-box}
    body{margin:0;width:390px;height:844px;background:#FAF8F5;color:#1C1917;
      font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
    .disp{font-family:Poppins,system-ui,sans-serif;font-weight:600;letter-spacing:-.01em;margin:0}
    .bar{height:56px;background:#fff;display:flex;align-items:center;
      padding:0 4px 0 16px;border-bottom:1px solid #E7E5E4}
    .bar h1{margin:0;font-size:20px;font-weight:600;font-family:Poppins,system-ui,sans-serif;flex:1}
    .icbtn{width:48px;height:48px;display:flex;align-items:center;justify-content:center}
    .body{padding:24px;display:flex;flex-direction:column;gap:16px}
    .card{background:#fff;border:1px solid #E7E5E4;border-radius:12px;padding:24px 20px}
    .btn{height:48px;border-radius:12px;background:#F5A623;color:#101A2C;
      font-family:Poppins,system-ui,sans-serif;font-weight:600;font-size:15px;
      display:flex;align-items:center;justify-content:center;border:0}
    a{color:#B45309}a:hover{color:#7C3D06}
  </style>
</helmet>
<div class="bar">
  <h1>Saan tayo?</h1>
  <div class="icbtn">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 3v9M6.5 6.5a8 8 0 1 0 11 0" stroke="#1C1917" stroke-width="1.7" stroke-linecap="round"></path>
    </svg>
  </div>
</div>

<div class="body">
  <div class="card" style="display:flex;flex-direction:column;align-items:center;gap:8px">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18ZM8.5 12.2l2.4 2.4 4.6-5"
        stroke="#15803D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
    <h2 class="disp" style="font-size:24px;text-align:center;margin-top:8px">
      How was your ride?
    </h2>
    <p style="margin:0;text-align:center;color:#57534E;font-size:15px">
      Kasama si Juan Dela Cruz · ABC 1234
    </p>

    <!-- Write-once: the rules refuse a second rating on the same ride. -->
    <div style="display:flex;gap:12px;margin:20px 0 4px">
      <svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3.5 2.6 5.5 6 .8-4.4 4.2 1.1 6-5.3-2.9-5.3 2.9 1.1-6L3.4 9.8l6-.8L12 3.5Z" fill="#F5A623"></path></svg>
      <svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3.5 2.6 5.5 6 .8-4.4 4.2 1.1 6-5.3-2.9-5.3 2.9 1.1-6L3.4 9.8l6-.8L12 3.5Z" fill="#F5A623"></path></svg>
      <svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3.5 2.6 5.5 6 .8-4.4 4.2 1.1 6-5.3-2.9-5.3 2.9 1.1-6L3.4 9.8l6-.8L12 3.5Z" fill="#F5A623"></path></svg>
      <svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3.5 2.6 5.5 6 .8-4.4 4.2 1.1 6-5.3-2.9-5.3 2.9 1.1-6L3.4 9.8l6-.8L12 3.5Z" fill="#F5A623"></path></svg>
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m12 3.5 2.6 5.5 6 .8-4.4 4.2 1.1 6-5.3-2.9-5.3 2.9 1.1-6L3.4 9.8l6-.8L12 3.5Z" stroke="#D6D3D1" stroke-width="1.4" stroke-linejoin="round"></path></svg>
    </div>

    <div style="width:100%;border:1px solid #A8A29E;border-radius:12px;padding:12px 14px;
      min-height:76px;margin-top:12px">
      <span style="font-size:15px;color:#A8A29E">May gusto ka bang sabihin? (opsyonal)</span>
    </div>
  </div>

  <div class="btn">Ipadala ang rating</div>

  <div style="text-align:center;color:#57534E;font-size:13px">
    Ang bayad ay ayon sa nakapaskil na taripa ng TODA.
  </div>
</div>
</x-dc>
</body>
</html>
