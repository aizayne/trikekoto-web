<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap">
  <style>
    *{box-sizing:border-box}
    body{margin:0;width:390px;height:844px;background:#FAF8F5;color:#1C1917;
      font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
    .disp{font-family:Poppins,system-ui,sans-serif;font-weight:600;letter-spacing:-.01em;margin:0}
    .bar{height:56px;background:#fff;display:flex;align-items:center;gap:4px;
      padding:0 4px;border-bottom:1px solid #E7E5E4}
    .bar h1{margin:0;font-size:20px;font-weight:600;font-family:Poppins,system-ui,sans-serif}
    .icbtn{width:48px;height:48px;display:flex;align-items:center;justify-content:center}
    .body{padding:24px;display:flex;flex-direction:column;gap:8px}
    .field{height:56px;border:1px solid #A8A29E;border-radius:12px;padding:6px 14px;
      display:flex;align-items:center;gap:12px;background:#fff}
    .btn{height:48px;border-radius:12px;background:#F5A623;color:#101A2C;
      font-family:Poppins,system-ui,sans-serif;font-weight:600;font-size:15px;
      display:flex;align-items:center;justify-content:center;gap:8px;border:0}
    .muted{color:#57534E;font-size:13px;line-height:1.45}
    a{color:#B45309}a:hover{color:#7C3D06}
  </style>
</helmet>
<div class="bar">
  <div class="icbtn">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M19 12H5M11 6l-6 6 6 6" stroke="#1C1917" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
  </div>
  <h1>Sign in</h1>
</div>

<div class="body">
  <h2 class="disp" style="font-size:24px;margin-bottom:8px">Ano ang number mo?</h2>
  <p style="margin:0 0 24px;font-size:15px;color:#57534E">
    Padadalhan ka namin ng code para makumpirma. Hindi ito ipapakita sa driver
    hangga&#39;t hindi ka nagbo-book.
  </p>

  <div class="field">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M6.5 3.5h11a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1v-15a1 1 0 0 1 1-1ZM10.5 17.5h3"
        stroke="#57534E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
    <span style="font-size:16px;color:#A8A29E">Mobile number</span>
  </div>
  <p class="muted" style="margin:0 0 24px;padding-left:14px">09XX XXX XXXX</p>

  <div class="btn">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M4 6.5h16v11H8l-4 3v-14Z" stroke="#101A2C" stroke-width="1.6"
        stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
    Send code
  </div>
</div>
</x-dc>
</body>
</html>
