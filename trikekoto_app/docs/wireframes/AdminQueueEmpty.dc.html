<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap">
  <style>
    *{box-sizing:border-box}
    body{margin:0;width:390px;height:844px;background:#FAF8F5;color:#1C1917;
      font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
    .disp{font-family:Poppins,system-ui,sans-serif;font-weight:600;letter-spacing:-.01em;margin:0}
    .bar{height:56px;background:#fff;display:flex;align-items:center;
      padding:0 4px 0 16px;border-bottom:1px solid #E7E5E4}
    .bar h1{margin:0;font-size:20px;font-weight:600;font-family:Poppins,system-ui,sans-serif;flex:1}
    .icbtn{width:48px;height:48px;display:flex;align-items:center;justify-content:center}
    .body{padding:16px;display:flex;flex-direction:column;gap:12px}
    .card{background:#fff;border:1px solid #E7E5E4;border-radius:12px;padding:16px}
    a{color:#B45309}a:hover{color:#7C3D06}
  </style>
</helmet>
<div class="bar">
  <h1>Verification</h1>
  <div class="icbtn">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 3v9M6.5 6.5a8 8 0 1 0 11 0" stroke="#1C1917" stroke-width="1.7" stroke-linecap="round"></path>
    </svg>
  </div>
</div>

<div class="body">
  <div class="card" style="display:flex;flex-direction:column;align-items:center;
    gap:12px;padding:48px 24px;text-align:center">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18ZM8.5 12.2l2.4 2.4 4.6-5"
        stroke="#15803D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
    <div class="disp" style="font-size:17px">Nothing waiting for review</div>
    <p style="margin:0;color:#57534E;font-size:15px;max-width:250px">
      Naaprubahan na ang lahat ng rehistro. Lilitaw dito ang mga bago.
    </p>
  </div>

  <div class="disp" style="font-size:17px;padding:8px 2px 0">Mga aprubadong driver (3)</div>

  <div class="card" style="padding:0">
    <div style="display:flex;align-items:center;gap:12px;padding:14px 16px">
      <div style="width:10px;height:10px;border-radius:50%;background:#15803D;flex:none"></div>
      <div style="flex:1">
        <div style="font-size:16px">Juan Dela Cruz</div>
        <div style="font-size:13px;color:#57534E">ABC 1234 · ★ 4.8 (36)</div>
      </div>
      <span style="font-size:13px;color:#15803D;font-weight:600">Online</span>
    </div>
    <div style="display:flex;align-items:center;gap:12px;padding:14px 16px;
      border-top:1px solid #E7E5E4">
      <div style="width:10px;height:10px;border-radius:50%;background:#D6D3D1;flex:none"></div>
      <div style="flex:1">
        <div style="font-size:16px">Pedro Ramos</div>
        <div style="font-size:13px;color:#57534E">XYZ 5678 · ★ 4.6 (21)</div>
      </div>
      <span style="font-size:13px;color:#57534E">Offline</span>
    </div>
    <div style="display:flex;align-items:center;gap:12px;padding:14px 16px;
      border-top:1px solid #E7E5E4">
      <div style="width:10px;height:10px;border-radius:50%;background:#D6D3D1;flex:none"></div>
      <div style="flex:1">
        <div style="font-size:16px">Mario Cruz</div>
        <div style="font-size:13px;color:#57534E">LMN 2244 · ★ 4.9 (12)</div>
      </div>
      <span style="font-size:13px;color:#57534E">Offline</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
