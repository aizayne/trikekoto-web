org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.io.tmpdir=C:\\Temp
android.useAndroidX=true

# Why the explicit java.io.tmpdir above:
#
# Gradle's NIO selector opens an AF_UNIX socket pair inside java.io.tmpdir. On
# this machine AF_UNIX bind succeeds but connect fails with EINVAL inside
# %LOCALAPPDATA%\Temp specifically - something filters that one directory -
# which surfaces as the opaque "Unable to establish loopback connection" and
# fails every Gradle build. The same fault blocks the Firestore emulator.
#
# Verified: AF_UNIX connect succeeds in C:\Temp and C:\Windows\Temp, and plain
# TCP loopback works everywhere, so this is not a firewall or a third-party
# Winsock LSP - the catalog has only Microsoft providers.
#
# C:\Temp must exist. To fix the cause instead, check Defender Controlled
# Folder Access and any sync client touching AppData\Local\Temp; then this
# argument can be removed.
