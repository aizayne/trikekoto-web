# ============================================================
# TrikeKoTo — continuous integration
# ============================================================
# Runs on every push and pull request touching the Flutter app.
#
# Three jobs, deliberately separate so a failure names itself:
#
#   analyze   static analysis and 95 Dart tests
#   rules     91 Firestore emulator tests (rules, lifecycle, attacks)
#   build     release APK, uploaded as an artifact
#
# `rules` is worth calling out: those tests are the only thing standing
# between a rules edit and a production data leak, and they cannot run on the
# maintainer's Windows machine without a TEMP workaround for a broken AF_UNIX
# socket. On Linux they just run — which makes CI the more reliable place to
# execute them than a developer's laptop.
# ============================================================

name: TrikeKoTo app

on:
  push:
    branches: [main]
    paths:
      - 'trikekoto_app/**'
      - '.github/workflows/trikekoto-app.yml'
  pull_request:
    paths:
      - 'trikekoto_app/**'
      - '.github/workflows/trikekoto-app.yml'
  workflow_dispatch:

# A second push supersedes the first; no value in finishing the old run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.41.7'
  APP_DIR: trikekoto_app

jobs:
  analyze:
    name: Analyze & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Verify formatting
        working-directory: ${{ env.APP_DIR }}
        # Informational: a formatting difference should not block a fix from
        # landing, but it should be visible in the log.
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        working-directory: ${{ env.APP_DIR }}
        run: flutter analyze --fatal-infos

      - name: Unit and widget tests
        working-directory: ${{ env.APP_DIR }}
        run: flutter test --reporter expanded

  rules:
    name: Firestore rules & lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/test_rules/package-lock.json

      - name: Set up Java for the Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 17 matches the locally pinned firebase-tools 13, which is what
          # test_rules/package.json installs.
          java-version: '17'

      - name: Install test dependencies
        working-directory: ${{ env.APP_DIR }}/test_rules
        run: npm ci

      - name: Cache the emulator jar
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}

      - name: Run rules, lifecycle and attack suites
        working-directory: ${{ env.APP_DIR }}/test_rules
        run: npm test

  functions:
    name: Cloud Functions typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the deployed runtime in functions/package.json. Node 20 is
          # decommissioned on 2026-10-30, after which it cannot be deployed at
          # all — typechecking against a runtime production does not use would
          # let a Node 22 incompatibility reach a deploy unseen.
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/functions/package-lock.json

      - name: Install
        working-directory: ${{ env.APP_DIR }}/functions
        run: npm ci

      # The functions cannot deploy until the Blaze plan is enabled, so
      # typechecking is the only guard they have. Without this they would rot
      # silently against schema changes.
      - name: Typecheck
        working-directory: ${{ env.APP_DIR }}/functions
        run: npm run typecheck

  build:
    name: Release APK
    runs-on: ubuntu-latest
    needs: [analyze, rules]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      # Build number comes from the run number so it is monotonic and never
      # repeats — Android refuses an update whose versionCode did not rise,
      # and hand-edited numbers eventually collide.
      #
      # This APK is debug-signed. Signing a real release needs a keystore held
      # in repository secrets, which is deliberately not set up yet: the
      # signing identity is permanent, and losing that key means never being
      # able to update an installed app again.
      - name: Build APK
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: trikekoto-${{ github.run_number }}
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error
